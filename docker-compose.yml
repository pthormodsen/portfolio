services:
  portfolio:
    build: .
    container_name: portfolio
    restart: unless-stopped
    depends_on:
      - leaderboard
    networks:
      - cloudflare
      - default

  leaderboard:
    build: ./server
    restart: unless-stopped
    volumes:
      - leaderboard-data:/data

volumes:
  leaderboard-data:

networks:
  cloudflare:
    external: true
    name: cloudflare
