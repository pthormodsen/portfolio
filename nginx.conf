limit_req_zone $binary_remote_addr zone=wpm:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/wpm/ {
        limit_req zone=wpm burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://leaderboard:3001;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
