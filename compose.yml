services:
  portfolio:
    image: ghcr.io/pthormodsen/portfolio-web:latest
    container_name: portfolio
    restart: unless-stopped
    depends_on:
      - leaderboard
    networks:
      - cloudflare
      - default

  leaderboard:
    image: ghcr.io/pthormodsen/portfolio-leaderboard:latest
    restart: unless-stopped
    environment:
      SCORES_FILE: /data/scores.json
    volumes:
      - leaderboard-data:/data

volumes:
  leaderboard-data:

networks:
  cloudflare:
    external: true
    name: cloudflare
